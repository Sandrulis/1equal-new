name: Event reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    name: send
    runs-on: ubuntu-latest
    steps:
      - name: Send due event reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set. The admin Cron page link can be used in cron-job.org instead."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" https://www.1equal.com/api/cron/reminders
